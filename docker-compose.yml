services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sbc
      MYSQL_USER: sbc
      MYSQL_PASSWORD: sbc
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usbc", "-psbc"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend: &backend
    image: sbc-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/backend
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      APP_ENV: dev
      APP_SECRET: dev-secret-change-me
      DATABASE_URL: mysql://sbc:sbc@mysql:3306/sbc?serverVersion=8.0&charset=utf8mb4
      DEFAULT_URI: http://localhost:${APP_PORT:-8080}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      NOTIFICATION_EMAIL: sbc.nefzi@gmail.com
      MAIL_FROM: onboarding@resend.dev
      ADMIN_PATH: /atelier-admin
      REVALIDATE_SECRET: changeme
    volumes:
      - backend_share:/var/www/backend/var/share
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    <<: *backend
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    restart: unless-stopped
    depends_on:
      - backend

  node:
    image: node:22
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - API_PROXY_TARGET=http://nginx
      - API_BASE_URL=http://nginx
      - NEXT_PUBLIC_API_BASE_URL=
      - NEXT_PUBLIC_ADMIN_PATH=/atelier-admin
      - ADMIN_PATH=/atelier-admin
      - REVALIDATE_SECRET=changeme

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - node
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  backend_share:
